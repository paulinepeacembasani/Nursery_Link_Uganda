# Render Blueprint: Dashboard → New → Blueprint → pick this repo. Creates the database, the API and
# the two sites in one go. Continuous delivery: every merge to main runs CI (.github/workflows/ci.yml);
# Render deploys each service only when those checks pass (autoDeployTrigger: checksPass), and the
# "Production" workflow then confirms the API is running that commit and smoke-tests the live sites.
# Values marked `sync: false` are asked for when the Blueprint is created.
#
# One origin per site: each static site forwards /api (and /media) to the API, so the browser sees
# the API on the site's own address. *.onrender.com is a public suffix, so without this the
# sign-in cookie would count as third-party and sessions would be lost on every reload.
#
# If Render gives a service a different address than the name below (the name was taken), change
# the https://nurserylink-….onrender.com URLs in this file and in the API's CORS_ORIGINS and
# PUBLIC_WEB_URL to match.

databases:
  - name: nurserylink-db
    databaseName: nurserylink
    user: nurserylink
    plan: free # expires after 30 days on Render's free plan: move to basic-256mb to keep the data
    region: frankfurt # must match the API's region: the internal database address only resolves within one region
    postgresMajorVersion: "16" # PostGIS, pg_trgm and pgcrypto are created by the first migration

services:
  - type: web
    name: nurserylink-api
    runtime: node
    plan: free # sleeps when idle, so background jobs (payment timeouts, auto-release) pause: use starter for real orders
    region: frankfurt # the closest Render region to Uganda
    buildCommand: npx -y pnpm@11.22.0 install --frozen-lockfile && npx -y pnpm@11.22.0 --filter @nurserylink/api build
    startCommand: ./scripts/render/start-api.sh
    healthCheckPath: /api/v1/health
    # Deploys only from main, and only once GitHub's CI checks on that commit have passed
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
        - e2e/**
        - "**/*.md"
        - .github/**
        - apps/web/**
        - apps/admin/**
    envVars:
      # pnpm 11 needs Node 22 (it uses node:sqlite); the code itself still targets Node 20
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nurserylink-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://nurserylink-web.onrender.com,https://nurserylink-admin.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://nurserylink-web.onrender.com
      # Requests arrive through Render's proxy; this makes the per-IP rate limits see the visitor
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: QUOTE_TOKEN_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      # Trial mode until SMS and mobile money are live: accounts work without an SMS code, and
      # orders are confirmed without payment (no money moves). Switch to required/on when ready.
      - key: PHONE_VERIFICATION
        value: "off"
      - key: PAYMENTS
        value: "off"
      - key: PAYMENT_PROVIDER_MODE
        value: mock
      # The needs-assessment survey (a Google Form "Send → link" URL), offered on first visit and at
      # /survey. Leave empty until it is ready. DEMO_NOTICE=off hides the "sample data" notice.
      - key: SURVEY_URL
        sync: false
      - key: DEMO_NOTICE
        value: "on"
      # Road distances and directions: set ROUTING_PROVIDER=openrouteservice and ORS_API_KEY (a free
      # key from https://openrouteservice.org/dev/#/signup). Left empty, the API uses straight-line
      # estimates (mock). On an existing Blueprint, add both in the service's Environment tab.
      - key: ROUTING_PROVIDER
        sync: false
      - key: ORS_API_KEY
        sync: false
      # The first administrator (created by the seed on first start; the password is never overwritten)
      - key: ADMIN_FULL_NAME
        sync: false
      - key: ADMIN_PHONE # e.g. 0772123456
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD # at least 12 characters
        sync: false

  - type: web
    name: nurserylink-web
    runtime: static
    buildCommand: npx -y pnpm@11.22.0 install --frozen-lockfile && npx -y pnpm@11.22.0 --filter @nurserylink/web build
    staticPublishPath: apps/web/dist
    # Deploys only from main, and only once GitHub's CI checks on that commit have passed
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
        - e2e/**
        - "**/*.md"
        - .github/**
        - apps/api/**
        - apps/admin/**
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nurserylink-api.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://nurserylink-api.onrender.com/media/*
      # The app's own pages (React Router): every other path is index.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: nurserylink-admin
    runtime: static
    buildCommand: npx -y pnpm@11.22.0 install --frozen-lockfile && npx -y pnpm@11.22.0 --filter @nurserylink/admin build
    staticPublishPath: apps/admin/dist
    # Deploys only from main, and only once GitHub's CI checks on that commit have passed
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
        - e2e/**
        - "**/*.md"
        - .github/**
        - apps/api/**
        - apps/web/**
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nurserylink-api.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://nurserylink-api.onrender.com/media/*
      # Seeded tree photos belong to the public site
      - type: rewrite
        source: /images/*
        destination: https://nurserylink-web.onrender.com/images/*
      - type: rewrite
        source: /*
        destination: /index.html
